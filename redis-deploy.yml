apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: webapp-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-peter
  template:
    metadata:
      labels:
        app: redis-peter
    spec:
      containers:
      - name: redis-name
        image: redis:7
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc